# .github/workflows/intraday.yml — nsebot INTRADAY (MIS) session, free.
#
# One job holds the whole session: it starts just after the open, polls
# Yahoo's 5-minute bars after every bar closes, runs the opening-range
# breakout engine, and squares everything off at 15:10 IST — before 15:15,
# and well ahead of Zerodha's own 15:20 auto-square-off and its fee. GitHub
# caps a job at 6 hours: starting at 09:22 leaves ~8 minutes for setup and
# the final commit before 15:12 + the cap (09:18 did not — the job would be
# killed just before the square-off). The opening range (09:15-09:30) is
# read from Yahoo's history, so the later start loses nothing.
#
# GitHub's scheduler often runs this repo's jobs hours late, which for an
# intraday session means a short or missed day. docs/SCHEDULING.md sets up a
# free external trigger (cron-job.org -> workflow_dispatch) that starts it on
# time; this schedule stays as the fallback.
#
# Sizing note: no intraday variant has passed out-of-sample yet
# (docs/RESEARCH.md), so the Kelly sizer trades the 0.5% risk floor and this
# job is, honestly, live data collection until its own trades say otherwise.
#
# State is committed at the end of the session (and on failure), so the
# breaker counters and trade journal persist between days.

name: NSE Intraday Bot

on:
  schedule:
    - cron: '52 3 * * 1-5'       # 09:22 IST, Mon-Fri (fallback; see docs/SCHEDULING.md)
  workflow_dispatch:

concurrency:
  group: nsebot-intraday         # one queue per bot (see main.yml)
  cancel-in-progress: false

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 360             # GitHub's maximum for a hosted runner
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Intraday session (until 15:10 square-off)
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          NSEBOT_BROKER: paper
        run: python -m nsebot intraday
      - name: Commit state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --staged --quiet; then
            echo "state unchanged"
            exit 0
          fi
          git commit -m "📈 intraday $(TZ=Asia/Kolkata date +'%Y-%m-%d') [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          echo "::error::could not push state after 4 attempts"
          exit 1
