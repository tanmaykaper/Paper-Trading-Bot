# .github/workflows/main.yml — nsebot SWING (CNC) end-of-day cycle
#
# Runs after the NSE close on weekdays: fills yesterday's plans at today's
# open, walks every open position through today's bar (stop / EMA-5 target /
# 7-session time stop), checks the circuit breakers, and plans tomorrow's
# entries. Then commits state/ back to the repo — the persistence step V2
# never had for its own pending book (docs/AUTOPSY_V2.md §2).
#
# Free: Yahoo daily bars, paper broker. Optional email via the existing
# EMAIL_SENDER / EMAIL_PASSWORD / EMAIL_RECIPIENT secrets.
# Re-runs are safe: a session already processed is skipped.
#
# GitHub's scheduler runs this repo's jobs hours late and drops some
# (docs/SCHEDULING.md), so the cycle is scheduled every hour through the
# night. The first step checks state/swing/ and stops within seconds when the
# session is already processed; the first slot that gets through does the
# work. A run before 15:45 IST the next day processes the previous session.

name: NSE Paper Trading Bot

on:
  schedule:
    # GitHub runs scheduled jobs late and drops some, worst at the top of the hour, so the
    # cycle is offered hourly at :43 from 17:13 IST through the night and twice before the
    # next open. The gate step makes every slot after the first successful one a ~10 s no-op.
    - cron: '43 11-18 * * 1-5'   # 17:13, 18:13 ... 00:13 IST
    - cron: '43 20,22 * * 1-5'   # 02:13, 04:13 IST
    - cron: '43 0,2 * * 2-6'     # 06:13, 08:13 IST next morning, before the open
  workflow_dispatch:

concurrency:
  group: nsebot-swing            # one queue per bot: GitHub keeps one waiting run per group, so a
  cancel-in-progress: false      # shared group let one bot's queued run cancel another's

jobs:
  swing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Anything to do?             # seconds; skips the rest when the work is already done
        id: gate
        run: python3 scripts/should_run.py swing
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Swing end-of-day cycle
        if: steps.gate.outputs.run == 'true'
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          NSEBOT_BROKER: paper
        run: python -m nsebot swing
      - name: Commit state
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --staged --quiet; then
            echo "state unchanged"
            exit 0
          fi
          git commit -m "📊 swing EOD $(TZ=Asia/Kolkata date +'%Y-%m-%d') [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          echo "::error::could not push state after 4 attempts"
          exit 1
