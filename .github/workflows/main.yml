# .github/workflows/main.yml — nsebot SWING (CNC) end-of-day cycle
#
# Runs after the NSE close on weekdays: fills yesterday's plans at today's
# open, walks every open position through today's bar (stop / EMA-5 target /
# 7-session time stop), checks the circuit breakers, and plans tomorrow's
# entries. Then commits state/ back to the repo — the persistence step V2
# never had for its own pending book (docs/AUTOPSY_V2.md §2).
#
# Free: Yahoo daily bars, paper broker. Optional email via the existing
# EMAIL_SENDER / EMAIL_PASSWORD / EMAIL_RECIPIENT secrets.
# Re-runs are safe: a session already processed is skipped.
#
# GitHub's scheduler runs this repo's jobs hours late and now and then drops
# one (docs/SCHEDULING.md), so the cycle is scheduled four times. The first
# run that gets through processes the session; the rest find nothing to do.
# A run before 15:45 IST the next day still processes the previous session.

name: NSE Paper Trading Bot

on:
  schedule:
    - cron: '45 11 * * 1-5'      # 17:15 IST, Mon-Fri (NSE closes 15:30; Yahoo settles by then)
    - cron: '15 14 * * 1-5'      # 19:45 IST  backup
    - cron: '15 17 * * 1-5'      # 22:45 IST  backup
    - cron: '15 1 * * 2-6'       # 06:45 IST next morning, before the open  backup
  workflow_dispatch:

concurrency:
  group: nsebot-swing            # one queue per bot: GitHub keeps one waiting run per group, so a
  cancel-in-progress: false      # shared group let one bot's queued run cancel another's

jobs:
  swing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Swing end-of-day cycle
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          NSEBOT_BROKER: paper
        run: python -m nsebot swing
      - name: Commit state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --staged --quiet; then
            echo "state unchanged"
            exit 0
          fi
          git commit -m "📊 swing EOD $(TZ=Asia/Kolkata date +'%Y-%m-%d') [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          echo "::error::could not push state after 4 attempts"
          exit 1
