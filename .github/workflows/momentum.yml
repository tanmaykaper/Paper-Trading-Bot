# .github/workflows/momentum.yml — nsebot MOMENTUM (CNC) sleeve, paper
#
# Runs after the swing cycle on weekdays. Fills the last rebalance's orders at
# today's open, marks the book to today's closes, and every 5 sessions ranks
# every NSE-listed stock by 12-1 momentum (docs/RESEARCH.md, round 6) and
# queues the next open's sales and buys. Rebalance days download NSE's equity
# list and ~2,600 symbols from Yahoo (a few minutes); other days fetch only
# the holdings. Commits state/momentum/ — ledger, journals and the saved NSE
# list the next run falls back on if NSE is unreachable.
#
# Free: Yahoo daily bars, NSE's public equity list, paper broker.
# Re-runs are safe: a session already processed is skipped, before any
# download, so the three backup slots cost seconds when the main run got
# through (GitHub runs schedules late and drops some: docs/SCHEDULING.md).

name: nsebot momentum

on:
  schedule:
    - cron: '10 12 * * 1-5'      # 17:40 IST, Mon-Fri — after the 17:15 swing run
    - cron: '40 14 * * 1-5'      # 20:10 IST  backup
    - cron: '40 17 * * 1-5'      # 23:10 IST  backup
    - cron: '40 1 * * 2-6'       # 07:10 IST next morning, before the open  backup
  workflow_dispatch:

concurrency:
  group: nsebot-momentum         # one queue per bot (see main.yml); each bot writes only its own
  cancel-in-progress: false      # state/<mode>/ and the commit step rebases and retries the push

jobs:
  momentum:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Momentum end-of-day cycle
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python -m nsebot momentum
      - name: Commit state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --staged --quiet; then
            echo "state unchanged"
            exit 0
          fi
          git commit -m "📈 momentum EOD $(TZ=Asia/Kolkata date +'%Y-%m-%d') [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          echo "::error::could not push state after 4 attempts"
          exit 1
